name: Build, test, and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build, test, and package
        shell: powershell
        run: .\build.ps1 -Package
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.2.0 --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit v0.2.0 --prerelease=false --latest --notes-file docs/RELEASE_NOTES.md
            if ($LASTEXITCODE) { throw 'Release update failed.' }
            Write-Host 'v0.2.0 is the latest stable release; existing tag and assets are unchanged.'
            exit 0
          }
          gh release create v0.2.0 `
            dist/GameSirPairing-0.2.0-win-x64.zip `
            dist/GameSirPairing-0.2.0-source.zip `
            dist/SHA256SUMS.txt `
            --target $env:GITHUB_SHA `
            --title 'GameSir G7 Pro Pairing v0.2.0' `
            --notes-file docs/RELEASE_NOTES.md `
            --latest
          if ($LASTEXITCODE) { throw 'Release creation failed.' }

